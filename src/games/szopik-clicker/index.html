<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szopik Klikacz</title>
<link rel="stylesheet" href="game.css">
</head>
<body>
<main class="game">
  <div class="top"><span>SZOPERO ORIGINAL</span><span>GRA 001</span></div>
  <h1>Szopik Klikacz</h1>
  <p class="subtitle">Klikaj szopika i zbieraj łapki!</p>
  <div class="score"><small>TWOJE ŁAPKI</small><strong id="score">0</strong></div>
  <button id="raccoon" class="raccoon" aria-label="Kliknij szopika">🦝</button>
  <p class="hint" id="hint">Kliknij szopika, aby zdobyć łapkę!</p>
  <div class="bottom"><span>Rekord: <b id="best">0</b></span><button id="reset">Zresetuj wynik</button></div>
</main>
<script src="game.js"></script>
</body>
</html>
