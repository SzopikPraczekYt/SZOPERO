<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szopik Breaker</title>
<style>
:root {
  --mint:#65f0c0;
  --blue:#65baff;
  --purple:#a78bfa;
  --bg:#080d18;
  --panel:#111b2d;
}
*{box-sizing:border-box}
body{
  margin:0;padding:15px;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% 0%,#203653 0%,transparent 55%),
    var(--bg);
  color:#f5f8ff;
  font-family:Segoe UI,Arial,sans-serif;
  display:flex;justify-content:center;align-items:center;
  overflow:auto;
}
.app{width:min(1050px,100%);margin:auto}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:15px;margin-bottom:14px;flex-wrap:wrap
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:48px;height:48px;border-radius:15px;
  display:grid;place-items:center;font-size:27px;
  background:linear-gradient(145deg,#65f0c0,#38a8c7);
  box-shadow:0 5px 25px #65f0c044
}
.brand h1{font-size:21px;margin:0;font-weight:900;letter-spacing:1px}
.brand small{display:block;color:#8495af;font-size:11px;margin-top:3px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{
  min-width:83px;padding:8px 12px;
  background:#111b2d;border:1px solid #293951;
  border-radius:12px;text-align:center
}
.stat span{display:block;color:#8395b0;font-size:9px;letter-spacing:1px;font-weight:800}
.stat strong{display:block;font-size:18px;margin-top:2px}
.stat.score strong{color:var(--mint)}
.stage{
  position:relative;
  display:flex;justify-content:center;align-items:center;
  width:100%;
  background:#0b1424;
  border:1px solid #31415c;
  border-radius:20px;
  padding:8px;
  box-shadow:0 20px 65px #0008, inset 0 0 30px #65baff08;
  overflow:hidden
}
canvas{
  display:block;
  width:min(100%,calc((100vh - 190px)*1.5));
  height:auto;
  aspect-ratio:3/2;
  border-radius:13px;
  touch-action:none;
  background:#0b1424;
}
.overlay{
  position:absolute;inset:8px;
  display:flex;align-items:center;justify-content:center;
  background:#070d19c9;
  backdrop-filter:blur(9px);
  border-radius:13px;
  padding:20px;
  text-align:center;
}
.overlay.hidden{display:none}
.modal{
  width:min(420px,100%);
  padding:30px 24px;
  border-radius:22px;
  background:linear-gradient(145deg,#19283e,#101a2c);
  border:1px solid #425574;
  box-shadow:0 20px 60px #0008;
}
.modal .emoji{font-size:42px;margin-bottom:8px}
.breaker-cover{display:block!important;width:180px!important;height:120px!important;object-fit:contain!important;margin:0 auto 16px!important;}
.modal h2{font-size:29px;margin:0 0 9px;letter-spacing:1px}
.modal p{color:#a8b8d0;line-height:1.6;font-size:14px;margin:0 0 22px}
button{
  border:0;cursor:pointer;
  font:800 13px Segoe UI,Arial,sans-serif;
  letter-spacing:.5px;
  border-radius:11px;padding:12px 19px;
  transition:.15s;
}
button:hover{transform:translateY(-2px);filter:brightness(1.12)}
button:active{transform:scale(.97)}
.primary{
  color:#07151a;
  background:linear-gradient(135deg,#77f5c8,#48cbb9);
  box-shadow:0 5px 20px #65f0c033;
}
.secondary{color:#dce8fa;background:#1c2b42;border:1px solid #354a68}
.bottom{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-top:12px;flex-wrap:wrap
}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.tip{font-size:11px;color:#8293ad}
.progress{
  height:5px;background:#1b2b42;border-radius:10px;
  margin-top:12px;overflow:hidden
}
.progress div{
  height:100%;width:0%;background:linear-gradient(90deg,#65baff,#65f0c0);
  transition:width .2s
}
@media(max-width:650px){
  body{padding:8px}
  .topbar{justify-content:center}
  .brand{width:100%;justify-content:center}
  .stats{width:100%;justify-content:center}
  .stat{flex:1;min-width:65px;padding:7px}
  .stat strong{font-size:15px}
  .stage{padding:4px;border-radius:13px}
  .overlay{inset:4px}
  .modal{padding:20px 14px}
  .modal h2{font-size:23px}
  .bottom{justify-content:center}
  .tip{text-align:center;width:100%}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">🦝</div>
      <div>
        <h1>SZOPIK BREAKER</h1>
        <small>AUTORSKA GRA SZOPIKPRACZEKYT</small>
      </div>
    </div>
    <div class="stats">
      <div class="stat score"><span>WYNIK</span><strong id="score">0</strong></div>
      <div class="stat"><span>REKORD</span><strong id="best">0</strong></div>
      <div class="stat"><span>POZIOM</span><strong id="level">1</strong></div>
      <div class="stat"><span>ŻYCIA</span><strong id="lives">♥ ♥ ♥</strong></div>
    </div>
  </header>

  <main class="stage">
    <canvas id="game" width="960" height="640"></canvas>
    <div class="overlay" id="overlay">
      <div class="modal">
        <img src="../../assets/games/szopik-breaker.png" id="modalEmoji" class="breaker-cover" alt="Szopik Breaker">
        <h2 id="modalTitle">SZOPIK BREAKER</h2>
        <p id="modalText">Rozbij wszystkie klocki, zbieraj bonusy i przechodź kolejne poziomy!</p>
        <button class="primary" id="mainButton">ROZPOCZNIJ GRĘ</button>
      </div>
    </div>
  </main>

  <div class="progress"><div id="progress"></div></div>

  <footer class="bottom">
    <div class="controls">
      <button class="secondary" id="pauseButton">Ⅱ PAUZA</button>
      <button class="secondary" id="restartButton">↻ OD NOWA</button>
    </div>
    <div class="tip">MYSZKA / DOTYK / A-D / STRZAŁKI · SPACJA = PAUZA</div>
  </footer>
</div>

<script>
(() => {
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
const W=960,H=640;

let state="playing";
let score=0,level=1,lives=3;
let best=Number(localStorage.getItem("szopikBreakerBest")||0);
let bricks=[],particles=[],drops=[],stars=[];
let keys={};
let last=0;
let shake=0;
let paddle={x:420,y:585,w:120,h:15,target:480};
let ball={x:480,y:560,r:10,vx:230,vy:-390,trail:[]};

const colors=["#5de5c0","#55b8ff","#a78bfa","#ffbd69","#ff779d","#f5e76b"];

function hud(){
  $("score").textContent=score.toLocaleString("pl-PL");
  $("best").textContent=best.toLocaleString("pl-PL");
  $("level").textContent=level;
  $("lives").textContent="♥ ".repeat(lives).trim()||"0";
  const total=bricks.length;
  const left=bricks.filter(b=>b.hp>0).length;
  $("progress").style.width=(total?100*(total-left)/total:0)+"%";
}

function saveScore(){
  if(score>best){
    best=score;
    localStorage.setItem("szopikBreakerBest",String(best));
  }
}

function overlay(emoji,title,message,button){
  $("modalEmoji").alt=emoji;
  $("modalTitle").textContent=title;
  $("modalText").textContent=message;
  $("mainButton").textContent=button;
  $("overlay").classList.remove("hidden");
}
function hideOverlay(){$("overlay").classList.add("hidden")}

function makeLevel(){
  bricks=[];
  const rows=Math.min(4+level,8);
  const cols=11;
  const bw=72,bh=25,gap=9;
  const total=cols*bw+(cols-1)*gap;
  const start=(W-total)/2;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const pattern=(r+c+level)%9;
      if(level>1 && pattern===0)continue;
      bricks.push({
        x:start+c*(bw+gap),y:88+r*(bh+gap),
        w:bw,h:bh,hp:level>=3 && r<2?2:1,
        maxHp:level>=3 && r<2?2:1,
        color:colors[(r+level-1)%colors.length],
        alive:true
      });
    }
  }
  hud();
}

function resetBall(){
  paddle.w=120;
  paddle.x=(W-paddle.w)/2;
  paddle.target=W/2;
  ball.x=W/2;ball.y=paddle.y-15;
  const speed=390+Math.min(level*20,150);
  ball.vx=(Math.random()>.5?1:-1)*150;
  ball.vy=-Math.sqrt(speed*speed-ball.vx*ball.vx);
  ball.trail=[];
}

function newGame(){
  score=0;level=1;lives=3;
  particles=[];drops=[];
  makeLevel();resetBall();
  state="playing";
  hideOverlay();
  hud();
}

function start(){
  if(state==="ready"){
    state="playing";hideOverlay();
  }else if(state==="paused"){
    state="playing";hideOverlay();
  }
}

function pause(){
  if(state==="playing"){
    state="paused";
    overlay("Ⅱ","PAUZA","Gra została zatrzymana. Możesz spokojnie odpocząć.","WRÓĆ DO GRY");
  }else if(state==="paused")start();
}

function gameOver(){
  state="over";saveScore();hud();
  overlay("🏁","KONIEC GRY","Twój wynik: "+score.toLocaleString("pl-PL")+" punktów. Rekord: "+best.toLocaleString("pl-PL")+".","ZAGRAJ PONOWNIE");
}

function nextLevel(){
  level++;
  makeLevel();resetBall();
  state="ready";
  overlay("⭐","POZIOM "+level,"Świetna robota! Kolejny poziom jest trudniejszy.","DALEJ");
}

function addPoints(n){
  score+=n;saveScore();hud();
}

function burst(x,y,color,count=12){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const s=60+Math.random()*220;
    particles.push({
      x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:.35+Math.random()*.45,max:.8,
      size:2+Math.random()*4,color
    });
  }
}

function dropBonus(x,y){
  if(Math.random()>.16)return;
  drops.push({x,y,vy:100,type:"wide",r:13});
}

function hitBrick(b){
  b.hp--;
  ball.vy=-ball.vy;
  shake=3;
  burst(ball.x,ball.y,b.color,8);
  if(b.hp<=0){
    b.alive=false;
    addPoints(10*level);
    burst(b.x+b.w/2,b.y+b.h/2,b.color,16);
    dropBonus(b.x+b.w/2,b.y+b.h/2);
  }else{
    addPoints(3*level);
  }
}

function circleRect(x,y,r,b){
  const cx=Math.max(b.x,Math.min(x,b.x+b.w));
  const cy=Math.max(b.y,Math.min(y,b.y+b.h));
  const dx=x-cx,dy=y-cy;
  return dx*dx+dy*dy<r*r;
}

function loseLife(){
  lives--;hud();shake=9;
  burst(ball.x,ball.y,"#ff779d",25);
  if(lives<=0){gameOver();return}
  resetBall();
  state="ready";
  overlay("💫","SPRÓBUJ JESZCZE RAZ","Zostało Ci żyć: "+lives+". Dasz radę!","KONTYNUUJ");
}

function movePaddle(x){
  paddle.target=Math.max(paddle.w/2,Math.min(W-paddle.w/2,x));
  if(state==="ready"){
    paddle.x=paddle.target-paddle.w/2;
    ball.x=paddle.x+paddle.w/2;
    ball.y=paddle.y-15;
  }
}

canvas.addEventListener("pointermove",e=>{
  const rect=canvas.getBoundingClientRect();
  movePaddle((e.clientX-rect.left)/rect.width*W);
});
canvas.addEventListener("pointerdown",()=>{
  if(state==="ready")start();
});

window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if([" ","arrowleft","arrowright"].includes(k))e.preventDefault();
  if(k===" "){
    if(state==="playing")pause();
    else if(state==="paused"||state==="ready")start();
  }
  if(k==="escape"&&state==="playing")pause();
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

$("mainButton").onclick=()=>{
  if(state==="over"){newGame();start();return}
  start();
};
$("pauseButton").onclick=pause;
$("restartButton").onclick=()=>newGame();

function update(dt){
  if(state!=="playing")return;

  const direction=(keys["arrowright"]||keys["d"]?1:0)-(keys["arrowleft"]||keys["a"]?1:0);
  if(direction)paddle.target+=direction*650*dt;
  paddle.target=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.target));
  paddle.x+=(paddle.target-paddle.w/2-paddle.x)*Math.min(1,dt*16);

  ball.trail.unshift({x:ball.x,y:ball.y});
  if(ball.trail.length>9)ball.trail.pop();

  const oldX=ball.x,oldY=ball.y;
  ball.x+=ball.vx*dt;
  ball.y+=ball.vy*dt;

  if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}
  if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}
  if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}

  if(ball.vy>0&&circleRect(ball.x,ball.y,ball.r,paddle)){
    const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
    const speed=Math.min(600,Math.hypot(ball.vx,ball.vy)*1.015);
    ball.vx=hit*speed*.85;
    ball.vy=-Math.sqrt(Math.max(10000,speed*speed-ball.vx*ball.vx));
    ball.y=paddle.y-ball.r-1;
    burst(ball.x,paddle.y,"#65f0c0",6);
  }

  for(const b of bricks){
    if(!b.alive||!circleRect(ball.x,ball.y,ball.r,b))continue;
    if(oldY+ball.r<=b.y||oldY-ball.r>=b.y+b.h)ball.vy=-ball.vy;
    else ball.vx=-ball.vx;
    hitBrick(b);
    break;
  }

  if(ball.y-ball.r>H){loseLife();return}

  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    d.y+=d.vy*dt;
    if(d.y+d.r>=paddle.y&&d.y-d.r<=paddle.y+paddle.h&&d.x>=paddle.x&&d.x<=paddle.x+paddle.w){
      paddle.w=170;
      addPoints(25*level);
      burst(d.x,d.y,"#65f0c0",20);
      drops.splice(i,1);
    }else if(d.y>H+30)drops.splice(i,1);
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=.98;p.vy=p.vy*.98+100*dt;
    p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }

  if(bricks.every(b=>!b.alive))nextLevel();
  if(shake>0)shake=Math.max(0,shake-dt*20);
}

function roundRect(x,y,w,h,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}

function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#101e34");
  bg.addColorStop(1,"#091321");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  for(const s of stars){
    ctx.globalAlpha=s.a;
    ctx.fillStyle="#b6d7ff";
    ctx.fillRect(s.x,s.y,s.size,s.size);
  }
  ctx.globalAlpha=1;

  ctx.strokeStyle="#a9caff0a";ctx.lineWidth=1;
  for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  // Klocki
  for(const b of bricks){
    if(!b.alive)continue;
    ctx.shadowColor=b.color;ctx.shadowBlur=10;
    roundRect(b.x,b.y,b.w,b.h,7,b.color);
    ctx.shadowBlur=0;
    roundRect(b.x+5,b.y+4,b.w-10,4,3,"#ffffff66");
    if(b.hp>1){
      ctx.fillStyle="#142238";ctx.font="bold 12px Segoe UI";
      ctx.textAlign="center";ctx.fillText("2",b.x+b.w/2,b.y+18);
    }
  }

  // Bonusy
  for(const d of drops){
    ctx.shadowColor="#65f0c0";ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fillStyle="#65f0c0";ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="#09251e";ctx.font="bold 15px Arial";
    ctx.textAlign="center";ctx.fillText("+",d.x,d.y+5);
  }

  // Cząsteczki
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.size,p.size);
  }
  ctx.globalAlpha=1;

  // Ślad piłki
  for(let i=ball.trail.length-1;i>=0;i--){
    const t=ball.trail[i];
    ctx.globalAlpha=(1-i/ball.trail.length)*.18;
    ctx.beginPath();ctx.arc(t.x,t.y,ball.r*(1-i/ball.trail.length),0,Math.PI*2);
    ctx.fillStyle="#65f0c0";ctx.fill();
  }
  ctx.globalAlpha=1;

  // Paletka
  const pg=ctx.createLinearGradient(paddle.x,0,paddle.x+paddle.w,0);
  pg.addColorStop(0,"#36bfae");pg.addColorStop(.5,"#9affdf");pg.addColorStop(1,"#36bfae");
  ctx.shadowColor="#65f0c0";ctx.shadowBlur=20;
  roundRect(paddle.x,paddle.y,paddle.w,paddle.h,8,pg);
  ctx.shadowBlur=0;
  roundRect(paddle.x+12,paddle.y+3,paddle.w-24,3,2,"#ffffff88");

  // Piłka
  ctx.shadowColor="#ffffff";ctx.shadowBlur=20;
  const g=ctx.createRadialGradient(ball.x-3,ball.y-4,1,ball.x,ball.y,ball.r);
  g.addColorStop(0,"#ffffff");g.addColorStop(1,"#8af9db");
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fillStyle=g;ctx.fill();
  ctx.shadowBlur=0;

  ctx.restore();
}

function frame(t){
  const dt=Math.min((t-last)/1000||0,0.03);
  last=t;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

for(let i=0;i<65;i++){
  stars.push({x:Math.random()*W,y:Math.random()*H,size:1+Math.random()*2,a:.12+Math.random()*.3});
}

makeLevel();
resetBall();
state="playing";
hideOverlay();
hud();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
